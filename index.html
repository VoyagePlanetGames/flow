<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flow — A Kanban that gets out of your way</title>
<meta name="description" content="A no-signup, no-cloud Kanban board. Built on day 89 of my 100-day coding challenge." />

<!-- Open Graph -->
<meta property="og:title" content="Flow — A Kanban that gets out of your way" />
<meta property="og:description" content="No signup, no cloud, no upsell. Just a Kanban board." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://voyageplanetgames.github.io/flow/" />
<meta name="theme-color" content="#080616" />

<!-- Favicon: forward arrow with motion trail -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'%3E%3Cpath d='M3 16 L10 16' stroke='%232F2FE4' stroke-width='3' stroke-linecap='round' opacity='0.35'/%3E%3Cpath d='M12 16 L25 16 M19 10 L26 16 L19 22' stroke='%232F2FE4' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* ---------- Reset ---------- */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea, select { font: inherit; color: inherit; }

  /* ---------- Palette (colorhunt 2F2FE4 162E93 1A1953 080616) ---------- */
  :root {
    --c-bg:        #080616;   /* deepest — page bg */
    --c-surface:   #1A1953;   /* card / column bg */
    --c-surface-2: #162E93;   /* hover / active states */
    --c-accent:    #2F2FE4;   /* primary brand blue */
    --c-accent-2:  #4747ff;   /* hover lift */

    --text:           #ffffff;
    --text-secondary: rgba(255, 255, 255, 0.72);
    --text-muted:     rgba(255, 255, 255, 0.45);

    --border:        rgba(47, 47, 228, 0.18);
    --border-strong: rgba(47, 47, 228, 0.40);

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35), 0 0 0 1px var(--border);
    --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.55);
    --glow:      0 0 24px rgba(47, 47, 228, 0.35);

    --col-todo:  #ff7a7a;
    --col-doing: #ffc266;
    --col-done:  #6be58e;

    --prio-high-bg: rgba(255, 99, 132, 0.14); --prio-high-fg: #ff8aa3;
    --prio-med-bg:  rgba(255, 184, 77, 0.14); --prio-med-fg:  #ffc97a;
    --prio-low-bg:  rgba(77, 171, 247, 0.14); --prio-low-fg:  #8ec5ff;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    background:
      radial-gradient(900px 600px at 12% -10%, rgba(47, 47, 228, 0.22), transparent 60%),
      radial-gradient(800px 500px at 100% 0%,  rgba(22, 46, 147, 0.30), transparent 60%),
      var(--c-bg);
    background-attachment: fixed;
    min-height: 100vh;
  }

  /* ---------- Layout ---------- */
  .app { max-width: 1280px; margin: 0 auto; padding: 32px 40px 120px; position: relative; z-index: 1; }
  @media (max-width: 700px) { .app { padding: 20px 16px 100px; } }

  /* ---------- Header ---------- */
  header.topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; margin-bottom: 32px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-logo {
    width: 40px; height: 40px;
    display: grid; place-items: center;
    filter: drop-shadow(0 0 10px rgba(47, 47, 228, 0.45));
  }
  .brand-logo svg { display: block; }
  .brand-text h1 {
    font-size: 22px; font-weight: 800;
    letter-spacing: -0.025em; line-height: 1.15;
    color: var(--text);
  }
  .brand-text .tag {
    font-size: 12px; color: var(--text-secondary);
    margin-top: 2px; letter-spacing: 0.01em;
  }

  .topbar-actions { display: flex; gap: 8px; align-items: center; }

  .btn {
    padding: 8px 14px; border-radius: 8px; font-weight: 500; font-size: 13px;
    color: var(--text);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    transition: background 0.15s, border-color 0.15s, transform 0.06s, box-shadow 0.15s;
  }
  .btn:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: var(--border-strong);
  }
  .btn:active { transform: translateY(1px); }

  .btn-primary {
    background: var(--c-accent); color: #fff;
    border-color: var(--c-accent);
    box-shadow: 0 4px 16px rgba(47, 47, 228, 0.4);
  }
  .btn-primary:hover {
    background: var(--c-accent-2);
    border-color: var(--c-accent-2);
    box-shadow: 0 6px 22px rgba(47, 47, 228, 0.55);
  }

  /* ---------- Stats ---------- */
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
    border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 24px; overflow: hidden;
    background: rgba(26, 25, 83, 0.5);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  @media (max-width: 700px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat {
    padding: 14px 18px;
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 2px;
  }
  .stat:last-child { border-right: none; }
  @media (max-width: 700px) {
    .stat:nth-child(2) { border-right: none; }
    .stat:nth-child(1), .stat:nth-child(2) { border-bottom: 1px solid var(--border); }
  }
  .stat .num {
    font-size: 24px; font-weight: 700; letter-spacing: -0.02em;
    color: var(--text);
  }
  .stat .lbl {
    font-size: 11px; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500;
  }

  /* ---------- Board ---------- */
  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 900px) { .board { grid-template-columns: 1fr; } }

  .column {
    background: rgba(26, 25, 83, 0.5);
    border: 1px solid var(--border);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 12px;
    padding: 10px;
    min-height: 400px;
    display: flex; flex-direction: column;
    transition: background 0.15s, border-color 0.15s;
  }
  .column.drag-over {
    background: rgba(47, 47, 228, 0.15);
    border-color: var(--c-accent);
    box-shadow: 0 0 0 1px var(--c-accent) inset;
  }

  .col-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 8px 12px;
  }
  .col-title {
    display: flex; align-items: center; gap: 8px;
    font-weight: 600; font-size: 13px; color: var(--text);
  }
  .col-dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
  .col-todo  .col-dot { background: var(--col-todo);  color: var(--col-todo); }
  .col-doing .col-dot { background: var(--col-doing); color: var(--col-doing); }
  .col-done  .col-dot { background: var(--col-done);  color: var(--col-done); }
  .col-count {
    font-size: 11px; padding: 1px 8px; border-radius: 4px;
    background: rgba(255, 255, 255, 0.08); color: var(--text-secondary);
    font-weight: 500;
  }

  .cards { display: flex; flex-direction: column; gap: 8px; flex: 1; padding: 0 2px; }
  .empty {
    color: var(--text-muted); font-size: 12px; padding: 20px 8px;
    text-align: center; line-height: 1.5;
  }

  /* ---------- Card ---------- */
  .card {
    background: rgba(8, 6, 22, 0.65);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    box-shadow: var(--shadow-sm);
    cursor: grab;
    user-select: none;
    transition: box-shadow 0.15s, border-color 0.15s, background 0.15s, transform 0.06s;
    position: relative;
  }
  .card:hover {
    border-color: var(--border-strong);
    background: rgba(8, 6, 22, 0.85);
    box-shadow: var(--shadow-md);
  }
  .card.dragging { opacity: 0.4; cursor: grabbing; }

  .card-title {
    font-weight: 500; font-size: 13.5px; line-height: 1.4;
    color: var(--text); padding-right: 44px;
    word-wrap: break-word;
  }
  .card-desc {
    font-size: 12.5px; color: var(--text-secondary);
    margin-top: 4px; line-height: 1.5;
    word-wrap: break-word;
  }
  .card-meta {
    display: flex; gap: 6px; align-items: center;
    margin-top: 10px; flex-wrap: wrap;
  }
  .chip {
    font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    line-height: 1.45; letter-spacing: 0.02em;
  }
  .chip.high { background: var(--prio-high-bg); color: var(--prio-high-fg); }
  .chip.med  { background: var(--prio-med-bg);  color: var(--prio-med-fg); }
  .chip.low  { background: var(--prio-low-bg);  color: var(--prio-low-fg); }
  .card-date { font-size: 11px; color: var(--text-muted); }

  .card-actions {
    position: absolute; top: 6px; right: 6px;
    display: flex; gap: 1px; opacity: 0;
    transition: opacity 0.15s;
  }
  .card:hover .card-actions { opacity: 1; }
  .icon-btn {
    width: 26px; height: 26px; border-radius: 5px;
    display: grid; place-items: center;
    color: var(--text-muted);
    transition: background 0.1s, color 0.1s;
  }
  .icon-btn:hover { background: rgba(255, 255, 255, 0.08); color: var(--text); }
  .icon-btn.danger:hover { background: var(--prio-high-bg); color: var(--prio-high-fg); }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(8, 6, 22, 0.75);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--c-surface);
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    padding: 24px;
    width: 100%; max-width: 460px;
    box-shadow: var(--shadow-lg);
    animation: pop 0.18s ease-out;
  }
  @keyframes pop { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal h2 {
    font-size: 16px; font-weight: 700; margin-bottom: 18px;
    color: var(--text); letter-spacing: -0.01em;
  }

  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 11px; color: var(--text-secondary);
    margin-bottom: 6px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .field input, .field textarea, .field select {
    width: 100%; padding: 9px 11px; border-radius: 7px;
    background: rgba(8, 6, 22, 0.6);
    border: 1px solid var(--border);
    color: var(--text); outline: none;
    font-size: 13.5px;
    transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    border-color: var(--c-accent);
    background: rgba(8, 6, 22, 0.85);
    box-shadow: 0 0 0 3px rgba(47, 47, 228, 0.22);
  }
  .field input::placeholder, .field textarea::placeholder { color: var(--text-muted); }
  .field textarea { resize: vertical; min-height: 70px; font-family: inherit; }
  .field select option { background: var(--c-surface); color: var(--text); }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 480px) { .field-row { grid-template-columns: 1fr; } }

  .modal-actions {
    display: flex; gap: 8px; justify-content: flex-end;
    margin-top: 18px;
    padding-top: 16px; border-top: 1px solid var(--border);
  }

  /* ---------- Buy Me a Coffee — refined ---------- */
  .bmc-fab {
    position: fixed; bottom: 24px; right: 24px; z-index: 50;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 11px 18px; border-radius: 999px;
    background: var(--c-accent);
    color: #fff;
    font-weight: 600; font-size: 13px;
    border: 1px solid var(--c-accent);
    box-shadow: 0 8px 24px rgba(47, 47, 228, 0.45), var(--glow);
    text-decoration: none;
    transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
  }
  .bmc-fab:hover {
    transform: translateY(-2px);
    background: var(--c-accent-2);
    box-shadow: 0 12px 32px rgba(47, 47, 228, 0.6), 0 0 32px rgba(47, 47, 228, 0.5);
  }
  .bmc-fab .bmc-emoji {
    display: inline-grid; place-items: center;
    width: 22px; height: 22px;
    background: #ffdd00; border-radius: 6px;
    font-size: 13px;
  }

  /* ---------- Footer ---------- */
  footer {
    margin-top: 56px; padding: 20px 0;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 12px; color: var(--text-muted);
  }
  footer a { color: var(--text-secondary); text-decoration: none; }
  footer a:hover { color: var(--text); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(47, 47, 228, 0.3); border-radius: 5px;
    border: 2px solid var(--c-bg);
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(47, 47, 228, 0.5); }
</style>
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">
        <!-- Forward arrow with motion trail -->
        <svg width="36" height="36" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Flow logo">
          <path d="M3 16 L10 16" stroke="#2F2FE4" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
          <path d="M12 16 L25 16 M19 10 L26 16 L19 22" stroke="#2F2FE4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>Flow</h1>
        <div class="tag">A Kanban that gets out of your way</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn" id="clearDoneBtn" title="Clear all Done cards">Clear Done</button>
      <button class="btn btn-primary" id="newTaskBtn">+ New task</button>
    </div>
  </header>

  <section class="stats">
    <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Total</div></div>
    <div class="stat"><div class="num" id="statTodo">0</div><div class="lbl">To Do</div></div>
    <div class="stat"><div class="num" id="statDoing">0</div><div class="lbl">In Progress</div></div>
    <div class="stat"><div class="num" id="statDone">0</div><div class="lbl">Done</div></div>
  </section>

  <main class="board">
    <div class="column col-todo" data-status="todo">
      <div class="col-head">
        <div class="col-title"><span class="col-dot"></span> To Do</div>
        <span class="col-count" id="countTodo">0</span>
      </div>
      <div class="cards" id="listTodo"></div>
    </div>
    <div class="column col-doing" data-status="doing">
      <div class="col-head">
        <div class="col-title"><span class="col-dot"></span> In Progress</div>
        <span class="col-count" id="countDoing">0</span>
      </div>
      <div class="cards" id="listDoing"></div>
    </div>
    <div class="column col-done" data-status="done">
      <div class="col-head">
        <div class="col-title"><span class="col-dot"></span> Done</div>
        <span class="col-count" id="countDone">0</span>
      </div>
      <div class="cards" id="listDone"></div>
    </div>
  </main>

  <footer>
    Made by <a href="https://buymeacoffee.com/chenbuilds" target="_blank" rel="noopener">Chen</a> · Day 89 of 100 · Data stays on your device
  </footer>
</div>

<!-- Buy Me a Coffee floating button -->
<a class="bmc-fab" href="https://buymeacoffee.com/chenbuilds" target="_blank" rel="noopener" id="bmcBtn">
  <span class="bmc-emoji">☕</span>
  Buy me a coffee
</a>

<!-- Task Modal -->
<div class="modal-overlay" id="modal">
  <form class="modal" id="taskForm">
    <h2 id="modalTitle">New task</h2>
    <input type="hidden" id="taskId" />
    <div class="field">
      <label for="taskTitle">Title</label>
      <input id="taskTitle" type="text" placeholder="What needs to be done?" required maxlength="120" />
    </div>
    <div class="field">
      <label for="taskDesc">Description</label>
      <textarea id="taskDesc" placeholder="Add details (optional)" maxlength="500"></textarea>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="taskPriority">Priority</label>
        <select id="taskPriority">
          <option value="low">Low</option>
          <option value="med" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>
      <div class="field">
        <label for="taskStatus">Status</label>
        <select id="taskStatus">
          <option value="todo" selected>To Do</option>
          <option value="doing">In Progress</option>
          <option value="done">Done</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
    </div>
  </form>
</div>

<script>
(() => {
  const STORAGE_KEY = 'flow.kanban.v1';
  const $ = (id) => document.getElementById(id);

  let tasks = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return seed();
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : seed();
    } catch (e) { return seed(); }
  }
  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
  function seed() {
    return [
      { id: uid(), title: 'Welcome to Flow', desc: 'Drag cards between columns. Click + New task to add your own.', priority: 'med', status: 'todo', createdAt: Date.now() },
      { id: uid(), title: 'Try editing this card', desc: 'Hover the card and click the pencil icon.', priority: 'low', status: 'doing', createdAt: Date.now() },
      { id: uid(), title: 'Ship Day 89', desc: 'You did it. Time for coffee.', priority: 'high', status: 'done', createdAt: Date.now() }
    ];
  }
  function uid() { return Math.random().toString(36).slice(2, 10); }

  function render() {
    const cols = { todo: $('listTodo'), doing: $('listDoing'), done: $('listDone') };
    Object.values(cols).forEach(el => el.innerHTML = '');
    const counts = { todo: 0, doing: 0, done: 0 };

    tasks.forEach(t => {
      counts[t.status] = (counts[t.status] || 0) + 1;
      cols[t.status]?.appendChild(cardEl(t));
    });

    for (const status of ['todo', 'doing', 'done']) {
      if (counts[status] === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = status === 'done'
          ? 'Nothing finished yet.'
          : (status === 'doing' ? 'Pull a card here when you start.' : 'No tasks yet.');
        cols[status].appendChild(empty);
      }
    }

    $('countTodo').textContent = counts.todo;
    $('countDoing').textContent = counts.doing;
    $('countDone').textContent = counts.done;
    $('statTotal').textContent = tasks.length;
    $('statTodo').textContent = counts.todo;
    $('statDoing').textContent = counts.doing;
    $('statDone').textContent = counts.done;
  }

  function cardEl(t) {
    const el = document.createElement('div');
    el.className = 'card';
    el.draggable = true;
    el.dataset.id = t.id;

    const chipLabel = { high: 'High', med: 'Medium', low: 'Low' }[t.priority];
    const date = new Date(t.createdAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

    el.innerHTML = `
      <div class="card-actions">
        <button class="icon-btn" title="Edit" data-act="edit">${iconEdit()}</button>
        <button class="icon-btn danger" title="Delete" data-act="del">${iconTrash()}</button>
      </div>
      <div class="card-title"></div>
      ${t.desc ? `<div class="card-desc"></div>` : ''}
      <div class="card-meta">
        <span class="chip ${t.priority}">${chipLabel}</span>
        <span class="card-date">${date}</span>
      </div>
    `;
    el.querySelector('.card-title').textContent = t.title;
    if (t.desc) el.querySelector('.card-desc').textContent = t.desc;

    el.addEventListener('dragstart', e => {
      el.classList.add('dragging');
      e.dataTransfer.setData('text/plain', t.id);
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));

    el.querySelector('[data-act="edit"]').addEventListener('click', (e) => { e.stopPropagation(); openModal(t); });
    el.querySelector('[data-act="del"]').addEventListener('click', (e) => {
      e.stopPropagation();
      if (confirm(`Delete "${t.title}"?`)) {
        tasks = tasks.filter(x => x.id !== t.id);
        save(); render();
      }
    });

    return el;
  }

  function iconEdit() { return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 113 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>'; }
  function iconTrash() { return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a2 2 0 012-2h2a2 2 0 012 2v2"/></svg>'; }

  document.querySelectorAll('.column').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
    col.addEventListener('drop', e => {
      e.preventDefault();
      col.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      const status = col.dataset.status;
      const t = tasks.find(x => x.id === id);
      if (t && t.status !== status) { t.status = status; save(); render(); }
    });
  });

  function openModal(task) {
    $('modal').classList.add('open');
    if (task) {
      $('modalTitle').textContent = 'Edit task';
      $('taskId').value = task.id;
      $('taskTitle').value = task.title;
      $('taskDesc').value = task.desc || '';
      $('taskPriority').value = task.priority;
      $('taskStatus').value = task.status;
    } else {
      $('modalTitle').textContent = 'New task';
      $('taskId').value = '';
      $('taskForm').reset();
      $('taskPriority').value = 'med';
      $('taskStatus').value = 'todo';
    }
    setTimeout(() => $('taskTitle').focus(), 50);
  }
  function closeModal() { $('modal').classList.remove('open'); }

  $('newTaskBtn').addEventListener('click', () => openModal(null));
  $('cancelBtn').addEventListener('click', closeModal);
  $('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
    if ((e.key === 'n' || e.key === 'N') && !$('modal').classList.contains('open') && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
      openModal(null);
    }
  });

  $('taskForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const id = $('taskId').value;
    const data = {
      title: $('taskTitle').value.trim(),
      desc: $('taskDesc').value.trim(),
      priority: $('taskPriority').value,
      status: $('taskStatus').value
    };
    if (!data.title) return;
    if (id) {
      const t = tasks.find(x => x.id === id);
      Object.assign(t, data);
    } else {
      tasks.unshift({ id: uid(), ...data, createdAt: Date.now() });
    }
    save(); render(); closeModal();
  });

  $('clearDoneBtn').addEventListener('click', () => {
    const done = tasks.filter(t => t.status === 'done').length;
    if (done === 0) return;
    if (confirm(`Clear ${done} completed task${done > 1 ? 's' : ''}?`)) {
      tasks = tasks.filter(t => t.status !== 'done');
      save(); render();
    }
  });

  render();
})();
</script>
</body>
</html>
